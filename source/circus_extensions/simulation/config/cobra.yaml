# The Cobra config file, containing the parameters for the simulation environment.

mode: train 

task:
  name: Cobra-Box-Push
  num_envs: 128
  headless: true
  resume: false 
  run_folder: 2025-07-10_06-53-29
  checkpoint: model_14600.pt

play:
  folder: 2025-07-08_10-08-19
  checkpoint: model_2999.pt 

sim:
  env_path: miniconda3/envs/isaac450/lib/python3.10/site-packages/isaacsim/exts/isaacsim.examples.interactive/isaacsim/examples/interactive/user_examples
  scripts: ["cobra_example.py", "cobra_example_extension.py"]

transfer:
  source_path: /projects/siliconsynapselab/sslab_isaaclab/logs/rsl_rl/cobra_rl
  log_name: 2025-12-18_12-11-23
  dest_path: logs/rsl_rl/cobra_rl

convert:
  urdf_in: robotarium/cobra/urdf/cobra.urdf
  usd_out: robotarium/cobra/usd/cobra/cobra.usd

visuals:
  enable: true
  video_length: 400
  video_interval: 4000

slurm:
  job_name: sslab_c_rl
  nodes: 1
  tasks_per_node: 1
  cpus_per_task: 2
  gres: gpu:h200:1
  mem: 128GB
  partition: gpu
  time: "8:00:00"
  output: "/projects/siliconsynapselab/sslab_isaaclab/hpc_logs/cobra/output_%j.txt"
  error:  "/projects/siliconsynapselab/sslab_isaaclab/hpc_logs/cobra/error_%j.txt"

container:
  docker_user: arjunviswanathan        # your Docker Hub username
  image_name: sslab-isaaclab           # repo name on Docker Hub
  image_tag: 20251201-152055
  convert:
    urdf_in: /workspace/robotarium/cobra/urdf/cobra.urdf
    usd_out: /workspace/robotarium/cobra/usd/cobra/cobra.usd

hpc:
  user: viswanathan.ar
  host: login.explorer.northeastern.edu
  project_dir: /projects/siliconsynapselab/sslab_isaaclab
  container_dir: /projects/siliconsynapselab/containers
  run_dir_base: /projects/siliconsynapselab/sslab_isaaclab/logs  # logs/checkpoints bind here
  apptainer_cache: /projects/siliconsynapselab/container_images/cache
  apptainer_tmp: /projects/siliconsynapselab/container_images/tmp