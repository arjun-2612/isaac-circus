# The Go2 config file, containing the parameters for the simulation environment.

mode: train

task:
  name: Unitree-Go2-DTC-Train 
  num_envs: 1
  headless: true
  resume: false 
  run_folder: 2025-09-11_14-36-14
  checkpoint: model_5400.pt

play:
  folder: 2025-09-11_14-36-14
  checkpoint: model_3600.pt

sim:
  env_path: miniconda3/envs/isaac450/lib/python3.10/site-packages/isaacsim/exts/isaacsim.examples.interactive/isaacsim/examples/interactive/user_examples
  scripts: ["go2_example.py", "go2_example_extension.py"]

convert:
  urdf_in: robotarium/unitree/go2/urdf/go2.urdf
  usd_out: robotarium/unitree/go2/usd/go2/go2.usd

transfer:
  source_path: /projects/siliconsynapselab/sslab_isaaclab/logs/rsl_rl/go2_rl
  log_name: 2025-12-18_12-11-23
  dest_path: logs/rsl_rl/go2_rl

visuals:
  enable: true
  video_length: 400
  video_interval: 10000

slurm:
  job_name: sslab_go2_rl
  nodes: 1
  tasks_per_node: 1
  cpus_per_task: 2
  gres: gpu:v100-sxm2:1
  mem: 128GB
  partition: gpu
  time: "8:00:00"
  output: "/projects/siliconsynapselab/sslab_isaaclab/hpc_logs/go2/output_%j.txt"
  error:  "/projects/siliconsynapselab/sslab_isaaclab/hpc_logs/go2/error_%j.txt"

container:
  docker_user: arjunviswanathan        # your Docker Hub username
  image_name: sslab-isaaclab           # repo name on Docker Hub
  image_tag: 20250911-141239
  convert:
    urdf_in: /workspace/robotarium/unitree/go2/urdf/go2.urdf
    usd_out: /workspace/robotarium/unitree/go2/usd/go2/go2.usd

hpc:
  user: viswanathan.ar
  host: login.explorer.northeastern.edu
  project_dir: /projects/siliconsynapselab/sslab_isaaclab
  container_dir: /projects/siliconsynapselab/containers
  run_dir_base: /projects/siliconsynapselab/sslab_isaaclab/logs  # logs/checkpoints bind here
  apptainer_cache: /projects/siliconsynapselab/container_images/cache
  apptainer_tmp: /projects/siliconsynapselab/container_images/tmp
